# Render Blueprint for the Django API (free plan). Setup steps: docs/deployment.md
#
# Without DATABASE_URL the demo runs on a SQLite file that is created and seeded during the
# build, so every deploy and every wake-up from sleep starts from the same clean demo data.
# Set DATABASE_URL (e.g. a free Neon Postgres) if changes should persist instead.
services:
  - type: web
    name: ai-office-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo --flush
    # Threads keep the server responsive while a request waits up to a minute for OpenAI
    startCommand: gunicorn core.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SERVE_MEDIA
        value: "True"
      # Shared demo accounts: keep AI usage per account modest (also set a limit in OpenAI)
      - key: THROTTLE_RATE_AI
        value: 30/hour
      # Filled in on the Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
